[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leukemia-yolo-stage1"
version = "0.1.0"
description = "Notebook-based BCCD WBC localization research pipeline"
requires-python = ">=3.11,<3.12"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
